<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Keydrop Offline</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111827; color: #f9fafb; }
    main { width: min(32rem, calc(100% - 2rem)); padding: 1.5rem; border: 1px solid #374151; border-radius: 1rem; background: #1f2937; }
    h1 { margin-top: 0; font-size: 1.5rem; }
    label { display: block; margin: 1rem 0 .4rem; }
    input, button { box-sizing: border-box; width: 100%; padding: .8rem; font: inherit; border-radius: .6rem; }
    button { margin-top: 1.2rem; border: 0; background: #60a5fa; color: #111827; font-weight: 700; }
    button.secondary { margin-top: .5rem; background: #d1d5db; }
    #status { min-height: 1.4rem; margin-bottom: 0; }
    #status[data-error="true"] { color: #fca5a5; }
    small { color: #cbd5e1; }
  </style>
</head>
<body>
  <main>
    <h1>Keydrop Offline</h1>
    <small id="intro">Расшифровка выполняется локально. Страница загружает только собственные файлы.</small>
    <p><a id="download-and-select" href="smoke-not-a-secret.toml.enc" download="smoke-not-a-secret.toml.enc">1. Скачать и сразу выбрать фиктивный .enc</a></p>
    <small id="download-help">После нажатия файл уже будет выбран ниже. Проводник Android открывать не нужно.</small>
    <form id="decrypt-form">
      <label for="encrypted-file">Зашифрованный файл</label>
      <input id="encrypted-file" type="file" accept=".enc,application/octet-stream" required>
      <small id="file-info">Файл ещё не выбран.</small>
      <label for="password">Пароль доставки</label>
      <input id="password" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      <button id="fill-test-password" class="secondary" type="button">Подставить тестовый пароль</button>
      <button id="toggle-password" class="secondary" type="button">Показать пароль</button>
      <button type="submit">2. Расшифровать</button>
    </form>
    <p id="status" role="status"></p>
  </main>
  <script src="decrypt.bundle.js"></script>
  <script src="autoselect.js"></script>
</body>
</html>
